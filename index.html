<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I N D I A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin: 10px; }
    
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; font-size: 15px; outline: none; }
    input { background: #334155; color: white; border: 1px solid #475569; }
    input:focus { border-color: #3b82f6; }
    
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }

    /* Chat UI */
    #chat-screen { display: none; height: 85vh; flex-direction: column; max-width: 500px; width: 100%; padding: 15px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #334155; }
    .chat-header h3 { font-size: 18px; color: #38bdf8; }
    .header-actions { display: flex; align-items: center; gap: 6px; }

    /* Header Buttons */
    .call-btn { background: #10b981; color: white; padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; width: auto; margin-top: 0; }
    .call-btn:hover { background: #059669; }
    
    .clear-btn { background: #ef4444; color: white; padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; width: auto; margin-top: 0; }
    .clear-btn:hover { background: #dc2626; }

    /* Typing Indicator Bar */
    #typing-status { font-size: 12px; color: #38bdf8; font-style: italic; min-height: 18px; margin-top: 4px; }

    #messages { flex: 1; overflow-y: auto; background: #0f172a; padding: 12px; margin: 8px 0 12px 0; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #1e293b; }
    
    .msg { display: flex; flex-direction: column; position: relative; padding: 8px 12px; border-radius: 12px; max-width: 82%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
    .msg-content { margin-right: 20px; }
    
    .msg-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 4px; cursor: pointer; }

    .my-msg { background: #1d4ed8; align-self: flex-end; border-bottom-right-radius: 2px; }
    .other-msg { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    .sender-name { font-size: 11px; color: #94a3b8; margin-bottom: 3px; font-weight: 600; }
    
    /* Status & Time Footer */
    .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; opacity: 0.85; color: #cbd5e1; }
    .my-msg .msg-footer { color: #93c5fd; }

    .delete-btn { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #f87171; cursor: pointer; padding: 0; margin: 0; width: auto; font-size: 12px; opacity: 0.7; }
    .delete-btn:hover { opacity: 1; }

    .input-box { display: flex; gap: 6px; align-items: center; }
    .input-box input { margin: 0; flex: 1; }
    .input-box button { width: auto; padding: 0 14px; margin: 0; height: 42px; display: flex; align-items: center; justify-content: center; }
    
    .icon-btn { background: #334155; border: 1px solid #475569; font-size: 18px; padding: 0 10px !important; }

    /* Camera Modal Styles */
    #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    #video-feed { width: 90%; max-width: 400px; border-radius: 12px; background: black; }
    .cam-btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .cam-btn { width: auto; padding: 10px 20px; font-size: 14px; }

    /* Video Call Overlay Styles */
    #video-call-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
    .video-container { position: relative; width: 90%; max-width: 500px; height: 70vh; background: #000; border-radius: 16px; overflow: hidden; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 15px; right: 15px; width: 100px; height: 140px; border-radius: 10px; object-fit: cover; border: 2px solid #38bdf8; background: #1e293b; }
    .call-controls { display: flex; gap: 15px; margin-top: 20px; }
    .end-call-btn { background: #ef4444; color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; width: auto; cursor: pointer; }
  </style>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Password Access Screen -->
  <div id="login-screen" class="card">
    <h2 style="margin-bottom: 5px; color: #38bdf8;"> MOTIVATIONAL SHAYARI </h2>
    <p style="color: #94a3b8; font-size: 13px;">What is your Name</p>
    
    <form onsubmit="event.preventDefault(); checkPassword();" autocomplete="off">
      <input 
        type="text" 
        id="pass-input" 
        placeholder="Enter your name ...." 
        autocomplete="chrome-off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false"
        onfocus="this.type='password'"
        required
      >
      <button type="submit">Enter</button>
    </form>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="card">
    <div class="chat-header">
      <h3 id="room-title">W E L C O M E !</h3>
      <div class="header-actions">
        <span id="user-display" style="font-size: 11px; color: #94a3b8; margin-right: 2px;"></span>
        <button class="call-btn" onclick="startVideoCall()" title="Start Video Call">📹 Call</button>
        <button class="clear-btn" onclick="clearAllMessages()" title="Clear All Chat">🗑️ Clear</button>
      </div>
    </div>
    
    <!-- Real-time Typing Status Header -->
    <div id="typing-status"></div>
    
    <div id="messages"></div>

    <form class="input-box" onsubmit="event.preventDefault(); sendMessage();" autocomplete="off">
      <!-- File Selector (Hidden) -->
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
      
      <!-- Upload File Button -->
      <button type="button" class="icon-btn" onclick="document.getElementById('file-input').click()" title="Image Upload">📁</button>
      
      <!-- Live Camera Button -->
      <button type="button" class="icon-btn" onclick="openCamera()" title="Take Photo">📷</button>

      <input 
        type="text" 
        id="msg-input" 
        placeholder="Message karein..." 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false"
        oninput="handleTyping()"
      >
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Live Camera Modal -->
  <div id="camera-modal">
    <video id="video-feed" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div class="cam-btn-group">
      <button class="cam-btn" style="background: #22c55e;" onclick="capturePhoto()">Click & Send</button>
      <button class="cam-btn" style="background: #ef4444;" onclick="closeCamera()">Cancel</button>
    </div>
  </div>

  <!-- Video Call Modal -->
  <div id="video-call-modal">
    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="end-call-btn" onclick="endVideoCall()">End Call 🔴</button>
    </div>
  </div>

  <script>
    const PASS_MAPPING = {
      "PH3": { roomName: "W E L C O M E !!", dbPath: "chat_private_1", userRole: "User A" },
      "PH4": { roomName: "W E L C O M E !!", dbPath: "chat_private_1", userRole: "User B" },
      "MANO3": { roomName: "W E L C O M E !!", dbPath: "chat_room_2", userRole: "User A" },
      "MANO4": { roomName: "W E L C O M E !!", dbPath: "chat_room_2", userRole: "User B" },
      "AA": { roomName: "W E L C O M E !!", dbPath: "chat_room_3", userRole: "User A" },
      "BB": { roomName: "W E L C O M E !!", dbPath: "chat_room_3", userRole: "User B" },
      "KUMAR0": { roomName: "W E L C O M E !!", dbPath: "chat_public_1", userRole: "RANDOM" },
      "K3":  { roomName: "W E L C O M E !!", dbPath: "chat_study_room", userRole: "RANDOM" }
    };

     const quotes = [
      "“Mehnat itni khamoshi se karo ki kamyabi shor macha de!”",
      "“Koshish aisi karo ki haarte haarte kab jeet jao, pata hi na chale!”",
      "“Mahaanta kabhi na girne me nahi, balki har baar girkar uthne me hai!”",
      "“Padhai aaj dard lag sakti hai, lekin kal yehi aapki sabse badi taqat banegi!”",
      "“Sapne wo nahi jo hum sochte waqt dekhte hain, sapne wo hain jo humein sone nahi dete!”",
      "“Jeet aur haar aapki soch par nirbhar karti hai, maano toh haar hai, thaan lo toh jeet!”",
      "“Lakh kathinaiyan aayein zindagi me, kabhi haar mat maano, mehnat ka fal zaroor milega!”",
      "“Waqt badalta hai, phir badlega... mehnat karte raho, poora jahan aapka hoga!”",
      "“Jo ho gaya use socha nahi karte, jab jaage tabhi savera... padhai par dhyan do!”",
      "“Manzil unhi ko milti hai jinne hauslon me jaan hoti hai, pankhon se kuch nahi hota, hauslon se udaan hoti hai!”",
      "“Koshish karne walon ki kabhi haar nahi hoti!”",
      "“Chhote chhote badlaav hi badi kamyabi ka hissa hote hain!”",
      "“Padhai me man nahi lage toh apne sapno ko yaad kar lena, rasta khud-ba-khud mil jayega!”",
      "“Zindagi ek baar milti hai, ise behtar banane me apni poori jaan laga do!”",
      "“Safalta ek din me nahi milti, lekin agar roz mehnat karo toh ek din zaroor milti hai!”"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyBJUJ_y_TucKJynY76FzBp7RAD0KkEV7zY",
      authDomain: "live-chat-8921e.firebaseapp.com",
      databaseURL: "https://live-chat-8921e-default-rtdb.firebaseio.com",
      projectId: "live-chat-8921e",
      storageBucket: "live-chat-8921e.firebasestorage.app",
      messagingSenderId: "494558285208",
      appId: "1:494558285208:web:7fd4f7b3f1b9ab51586fed"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // Free ImgBB API Key for Photo Uploads
    const IMGBB_API_KEY = "3d9e7c90755591c8aa4d7ec8edb2170b";

    let myName = "";
    let activeRoomPath = "";
    let typingTimeout = null;
    let cameraStream = null;

    // WebRTC Variables
    let peerConnection = null;
    let localStream = null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    function getCurrentFormattedTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function checkPassword() {
      const enteredPass = document.getElementById("pass-input").value.trim();

      if (PASS_MAPPING[enteredPass]) {
        const config = PASS_MAPPING[enteredPass];
        activeRoomPath = config.dbPath;

        if (config.userRole === "RANDOM") {
          const randomNum = Math.floor(1000 + Math.random() * 9000);
          myName = "User-" + randomNum;
        } else {
          myName = config.userRole;
        }

        document.getElementById("room-title").textContent = config.roomName;
        document.getElementById("user-display").textContent = "You: " + myName;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        
        loadMessages();
        listenTypingStatus();
        listenForVideoCall();
      } else {
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        alert("WELCOME!\n\n💡 Aaj Ka Vichar:\n" + randomQuote);
        document.getElementById("pass-input").value = "";
      }
    }

    // --- TYPING FEATURE LOGIC ---
    function handleTyping() {
      if (!activeRoomPath || !myName) return;
      const typingRef = database.ref(`${activeRoomPath}_typing/${myName}`);
      typingRef.set(true);
      typingRef.onDisconnect().remove();

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typingRef.remove();
      }, 2000);
    }

    function listenTypingStatus() {
      const typingStatusDiv = document.getElementById("typing-status");
      database.ref(`${activeRoomPath}_typing`).off();

      database.ref(`${activeRoomPath}_typing`).on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const typers = Object.keys(data).filter(user => user !== myName);
          typingStatusDiv.textContent = typers.length > 0 ? `✍️ ${typers.join(", ")} typing...` : "";
        } else {
          typingStatusDiv.textContent = "";
        }
      });
    }

    // --- SEND MESSAGE LOGIC ---
    function sendMessage(imageUrl = null) {
      const msgInput = document.getElementById("msg-input");
      const text = msgInput.value.trim();

      if ((text !== "" || imageUrl) && activeRoomPath !== "") {
        msgInput.value = "";
        database.ref(`${activeRoomPath}_typing/${myName}`).remove();

        const currentTime = getCurrentFormattedTime();

        database.ref(activeRoomPath).push({
          sender: myName,
          message: text,
          image: imageUrl || null,
          timestamp: Date.now(),
          sentAt: currentTime,
          seenBy: { [myName]: true }
        });
        
        msgInput.focus();
      }
    }

    // --- CAMERA & FILE UPLOAD LOGIC ---
    async function openCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById("video-feed").srcObject = cameraStream;
        document.getElementById("camera-modal").style.display = "flex";
      } catch (err) {
        alert("Camera access denied ya camera support nahi hai.");
      }
    }

    function closeCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById("camera-modal").style.display = "none";
    }

    function capturePhoto() {
      const video = document.getElementById("video-feed");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      canvas.toBlob(blob => {
        closeCamera();
        uploadImageToHost(blob);
      }, "image/jpeg", 0.7);
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        uploadImageToHost(file);
      }
    }

    function uploadImageToHost(fileOrBlob) {
      const formData = new FormData();
      formData.append("image", fileOrBlob);

      const msgInput = document.getElementById("msg-input");
      msgInput.placeholder = "Uploading image...";

      fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          sendMessage(data.data.url);
        } else {
          alert("Image upload fail ho gaya!");
        }
      })
      .catch(() => alert("Network error: Upload failed."))
      .finally(() => {
        msgInput.placeholder = "Message karein...";
      });
    }

    // --- LOAD MESSAGES LOGIC ---
    function loadMessages() {
      const msgBox = document.getElementById("messages");
      database.ref(activeRoomPath).off();

      database.ref(activeRoomPath).on("value", (snapshot) => {
        const data = snapshot.val();
        const fragment = document.createDocumentFragment();

        if (data) {
          Object.keys(data).forEach((key) => {
            const msgData = data[key];
            const msgDiv = document.createElement("div");
            
            const isMe = msgData.sender === myName;
            msgDiv.className = "msg " + (isMe ? "my-msg" : "other-msg");
            const currentTime = getCurrentFormattedTime();

            if (!isMe && (!msgData.seenBy || !msgData.seenBy[myName])) {
              database.ref(`${activeRoomPath}/${key}/seenBy/${myName}`).set(true);
              if (!msgData.seenAt) {
                database.ref(`${activeRoomPath}/${key}/seenAt`).set(currentTime);
                msgData.seenAt = currentTime;
              }
              if (!msgData.seenBy) msgData.seenBy = {};
              msgData.seenBy[myName] = true;
            }

            const seenUsers = msgData.seenBy ? Object.keys(msgData.seenBy).filter(u => u !== msgData.sender) : [];
            const isSeenByOthers = seenUsers.length > 0;
            const sentTime = msgData.sentAt || "";

            let statusText = isMe 
              ? (isSeenByOthers ? `👁️ ${msgData.seenAt || currentTime}` : `✓ ${sentTime}`) 
              : sentTime;

            let contentHTML = "";
            if (msgData.message) {
              contentHTML += `<span class="msg-content">${msgData.message}</span>`;
            }
            if (msgData.image) {
              contentHTML += `<a href="${msgData.image}" target="_blank"><img src="${msgData.image}" class="msg-img" /></a>`;
            }

            msgDiv.innerHTML = `
              ${!isMe ? `<span class="sender-name">${msgData.sender}</span>` : ""}
              ${contentHTML}
              <div class="msg-footer">
                <span>${statusText}</span>
              </div>
              <button class="delete-btn" onclick="deleteMessage('${key}')" title="Delete">🗑️</button>
            `;

            fragment.appendChild(msgDiv);
          });
        }

        msgBox.innerHTML = "";
        msgBox.appendChild(fragment);
        msgBox.scrollTop = msgBox.scrollHeight;
      });
    }

    // --- DELETE SINGLE MESSAGE ---
    function deleteMessage(key) {
      
        database.ref(activeRoomPath).child(key).remove();
      
    }

    // --- CLEAR ALL MESSAGES LOGIC ---
    function clearAllMessages() {
      if (activeRoomPath !== "") {
        if (confirm("Kya aap is room ke sabhi messages ko delete karna chahte hain?")) {
          database.ref(activeRoomPath).remove();
        }
      }
    }

    // --- WEBRTC VIDEO CALL LOGIC ---
    async function startVideoCall() {
      document.getElementById("video-call-modal").style.display = "flex";
      setupPeerConnection();

      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById("local-video").srcObject = localStream;
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      database.ref(`${activeRoomPath}_call`).set({
        type: "offer",
        offer: { sdp: offer.sdp, type: offer.type },
        sender: myName
      });
    }

    function listenForVideoCall() {
      const callRef = database.ref(`${activeRoomPath}_call`);
      callRef.on("value", async (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.type === "offer" && data.sender !== myName) {
          if (confirm(`${data.sender} aapko video call kar rahe hain. Accept karein?`)) {
            document.getElementById("video-call-modal").style.display = "flex";
            setupPeerConnection();

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("local-video").srcObject = localStream;
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            database.ref(`${activeRoomPath}_call`).update({
              type: "answer",
              answer: { sdp: answer.sdp, type: answer.type },
              receiver: myName
            });
          }
        } else if (data.type === "answer" && data.sender === myName) {
          if (peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        } else if (data.type === "candidate" && data.sender !== myName) {
          if (peerConnection && data.candidate) {
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) {}
          }
        } else if (data.type === "end") {
          endVideoCall(false);
        }
      });
    }

    function setupPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        document.getElementById("remote-video").srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          database.ref(`${activeRoomPath}_call`).set({
            type: "candidate",
            candidate: event.candidate.toJSON(),
            sender: myName
          });
        }
      };
    }

    function endVideoCall(notify = true) {
      if (notify && activeRoomPath) {
        database.ref(`${activeRoomPath}_call`).set({ type: "end", sender: myName });
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      document.getElementById("video-call-modal").style.display = "none";
    }
  </script>
</body>
</html>
