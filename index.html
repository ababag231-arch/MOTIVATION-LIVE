<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Chat</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 14px; }
    input { background: #334155; color: white; outline: none; }
    button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    #chat-screen { display: none; }
    #messages { height: 260px; overflow-y: auto; background: #0f172a; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #334155; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
    .my-msg { background: #2563eb; align-self: flex-end; }
  </style>
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Password Access Screen -->
  <div id="login-screen" class="card">
    <h2 style="margin-top:0;">Private Access</h2>
    <input type="text" id="username" placeholder="Apna Naam (e.g. Rahul)">
    <input type="password" id="pass-input" placeholder="Fix Password Access">
    <button onclick="checkPassword()">Enter Chat Room</button>
    <p id="error-msg" style="color:#ef4444; display:none; font-size:13px; margin-top:8px;">Galat Password!</p>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="card">
    <h3 style="margin-top:0;">1-on-1 Private Chat</h3>
    <div id="messages"></div>
    <input type="text" id="msg-input" placeholder="Message likho..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // 1. AAPKA FIX PASSWORD (Aap ise badal sakte hain)
    const FIX_PASSWORD = "KUMAR0";

    // 2. AAPKA FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBJUJ_y_TucKJynY76FzBp7RAD0KkEV7zY",
      authDomain: "live-chat-8921e.firebaseapp.com",
      databaseURL: "https://live-chat-8921e-default-rtdb.firebaseio.com", // Agar aapka Database URL alag ho toh use yahan update karein
      projectId: "live-chat-8921e",
      storageBucket: "live-chat-8921e.firebasestorage.app",
      messagingSenderId: "494558285208",
      appId: "1:494558285208:web:7fd4f7b3f1b9ab51586fed"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let myName = "";

    function checkPassword() {
      const enteredPass = document.getElementById("pass-input").value;
      const enteredName = document.getElementById("username").value.trim();

      if (enteredName === "") {
        alert("Kripya apna naam bharein!");
        return;
      }

      if (enteredPass === FIX_PASSWORD) {
        myName = enteredName;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "block";
        loadMessages();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function sendMessage() {
      const msgInput = document.getElementById("msg-input");
      const text = msgInput.value.trim();
      if (text !== "") {
        database.ref("private_chat").push({
          sender: myName,
          message: text,
          timestamp: Date.now()
        });
        msgInput.value = "";
      }
    }

    function loadMessages() {
      database.ref("private_chat").on("child_added", (snapshot) => {
        const data = snapshot.val();
        const msgBox = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        
        msgDiv.classList.add("msg");
        if (data.sender === myName) {
          msgDiv.classList.add("my-msg");
          msgDiv.textContent = data.message;
        } else {
          msgDiv.textContent = data.sender + ": " + data.message;
        }
        
        msgBox.appendChild(msgDiv);
        msgBox.scrollTop = msgBox.scrollHeight;
      });
    }
  </script>
</body>
</html>
